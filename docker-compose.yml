services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gymbro
      POSTGRES_USER: gymbro
      POSTGRES_PASSWORD: gymbro
    ports:
      - "5432:5432"
    volumes:
      - gymbro-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymbro"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/gymbro
      DB_USERNAME: gymbro
      DB_PASSWORD: gymbro
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32bytes-minimum-000}
    ports:
      - "8080:8080"

volumes:
  gymbro-db:
