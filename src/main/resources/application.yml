spring:
  application:
    name: gymbro
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymbro}
    username: ${DB_USERNAME:gymbro}
    password: ${DB_PASSWORD:gymbro}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Flyway owns the schema; see DECISIONS.md
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: true

gymbro:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum-000}
    issuer: gymbro
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  rate-limit:
    auth:
      capacity: 10
      window: 1m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.flywaydb: info
